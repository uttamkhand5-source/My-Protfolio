{% extends "admin/base.html" %}{% block content %}<div class="page-head"><h1>Site Settings</h1></div><form class="panel form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{item.name}}"></label><label>Role<input name="role" value="{{item.role}}"></label><label>Tagline<textarea name="tagline">{{item.tagline}}</textarea></label><label>About<textarea name="about" rows="5">{{item.about}}</textarea></label><label>Email<input name="email" value="{{item.email}}"></label><label>Location<input name="location" value="{{item.location}}"></label><label>Profile image<input type="file" name="profile_image" accept="image/*" data-crop-aspect="1"><small class="crop-help">Choose an image, adjust the crop, then click Crop &amp; Use Image before saving settings. The cropped file is submitted as the actual upload.</small></label><label>GitHub<input name="github" value="{{item.github}}"></label><label>LinkedIn<input name="linkedin" value="{{item.linkedin}}"></label><label>Instagram<input name="instagram" value="{{item.instagram}}"></label><button class="save">Save Settings</button></form>{% endblock %}
