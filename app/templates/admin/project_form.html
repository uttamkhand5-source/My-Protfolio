{% extends "admin/base.html" %}{% block content %}<div class="page-head"><div><span>PROJECT</span><h1>{{'Edit' if item.id else 'New'}} Project</h1></div></div><form class="panel form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" value="{{item.title}}" required></label><label>Description<textarea name="description" required>{{item.description}}</textarea></label><label>Technologies<input name="technologies" value="{{item.technologies}}" placeholder="Python, Flask, JavaScript"></label><label>Project image<input type="file" name="image" accept="image/*" data-crop-aspect="1.6666667"><small class="crop-help">Choose an image, adjust the crop, then click Crop &amp; Use Image before saving the project. The cropped file is submitted as the actual upload.</small></label><label>GitHub URL<input name="github_url" value="{{item.github_url}}"></label><label>Live URL<input name="live_url" value="{{item.live_url}}"></label><label class="check"><input type="checkbox" name="featured" {% if item.featured %}checked{% endif %}> Show on homepage</label><button class="save">Save Project</button></form>{% endblock %}
