{% extends "admin/base.html" %}{% block content %}<div class="page-head"><div><span>CONTENT</span><h1>Projects</h1></div><a class="add" href="{{url_for('admin.project_form')}}">+ New Project</a></div><div class="panel"><table><tr><th>Project</th><th>Tech</th><th>Featured</th><th>Actions</th></tr>{% for p in items %}<tr><td><b>{{p.title}}</b><br><small>{{p.description[:70]}}</small></td><td>{{p.technologies}}</td><td>{{'Yes' if p.featured else 'No'}}</td><td><a href="{{url_for('admin.project_form',id=p.id)}}">Edit</a><form class="inline" method="post" action="{{url_for('admin.project_delete',id=p.id)}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
