{% extends "admin/base.html" %}{% block content %}<div class="page-head"><h1>Certificates</h1></div><form class="panel rowform" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="title" placeholder="Certificate" required><input name="issuer" placeholder="Issuer"><input name="year" placeholder="Year"><input name="url" placeholder="Verification URL"><button class="save">Add</button></form><div class="panel"><table><tr><th>Certificate</th><th>Issuer</th><th>Year</th><th></th></tr>{% for x in items %}<tr><td>{{x.title}}</td><td>{{x.issuer}}</td><td>{{x.year}}</td><td><form class="inline" method="post" action="{{url_for('admin.certificate_delete',id=x.id)}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
