<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{url_for('static',filename='css/admin.css')}}"></head><body class="login-page"><form class="login-box" method="post">
    <input type="hidden" name="csrf_token"
           value="{{ csrf_token() }}">

    <h1>Welcome back.</h1>
    <p>Sign in to manage your portfolio.</p>

    <input name="username"
           placeholder="Username" required autofocus>

    <input name="password"
           type="password"
           placeholder="Password" required>

    <button>Sign In →</button>
</form></body></html>
