{% extends "admin/base.html" %}{% block content %}<div class="page-head"><h1>Experience</h1></div><form class="panel form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required></label><label>Company<input name="company"></label><label>Period<input name="period" placeholder="2025 — Present"></label><label>Description<textarea name="description"></textarea></label><button class="save">Add Experience</button></form><div class="panel"><table><tr><th>Role</th><th>Period</th><th></th></tr>{% for x in items %}<tr><td>{{x.title}}<br><small>{{x.company}}</small></td><td>{{x.period}}</td><td><form class="inline" method="post" action="{{url_for('admin.experience_delete',id=x.id)}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
