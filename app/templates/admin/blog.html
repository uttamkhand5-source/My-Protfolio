{% extends "admin/base.html" %}{% block content %}<div class="page-head"><h1>Blog</h1></div><form class="panel form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required></label><label>Slug<input name="slug" placeholder="my-first-post" required></label><label>Excerpt<textarea name="excerpt" rows="2"></textarea></label><label>Content<textarea name="content" rows="8"></textarea></label><label class="check"><input type="checkbox" name="published" checked> Published</label><button class="save">Publish</button></form><div class="panel"><table><tr><th>Title</th><th>Status</th><th></th></tr>{% for x in items %}<tr><td>{{x.title}}</td><td>{{'Published' if x.published else 'Draft'}}</td><td><form class="inline" method="post" action="{{url_for('admin.blog_delete',id=x.id)}}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
